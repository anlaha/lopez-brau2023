  //balanced position lists: returns n_trials positions (0 = leftmost button) in a random order,
  //with every position from 0 to n_positions-1 used as equally often as possible.
  //e.g. balanced_positions(8, 3) uses each of the 3 positions 2 or 3 times across the 8 trials,
  //and balanced_positions(8, 2) puts something on the left exactly 4 times and on the right 4 times.
  //(shuffling each trial on its own does not guarantee this: by chance one position can come up 5 of 8 times.)
  function balanced_positions(n_trials, n_positions) {
    var positions = [];
    while (positions.length < n_trials) {
      var one_of_each = [];
      for (let p = 0; p < n_positions; p++) { one_of_each.push(p); }
      positions = positions.concat(jsPsych.randomization.shuffle(one_of_each));
    }
    //the last, partial set is a random subset, so which positions get the extra trials is random too
    return jsPsych.randomization.shuffle(positions.slice(0, n_trials));
  }
